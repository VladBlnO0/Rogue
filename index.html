<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>roguelike-js</title>
    <style>
      @import url("./style.css");
    </style>
  </head>
  <body>
    <div id="game-layout">
      <aside id="sidebar">
        <h2 id="ui-name">Hero</h2>

        <div class="stat-group">
          <label>Class:</label> <span id="ui-class">-</span>
        </div>

        <div class="stat-group">
          <label>Time:</label> <span id="ui-time">00:00:00</span>
        </div>

        <div class="bar-container">
          <div class="bar-label">HP: </br> <span id="ui-hp">0/0</span></div>

          <div class="bar-bg">
            <div id="bar-hp-fill" class="bar-fill hp"></div>
          </div>
        </div>

        <div class="bar-container">
          <div class="bar-label">Stamina: </br> <span id="ui-stamina">0/0</span></div>

          <div class="bar-bg">
            <div id="bar-stamina-fill" class="bar-fill stamina"></div>
          </div>
        </div>

        <div class="bar-container">
          <div class="bar-label">Mana: </br> <span id="ui-mana">0/0</span></div>

          <div class="bar-bg">
            <div id="bar-mana-fill" class="bar-fill mana"></div>
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: auto;">
          <button id="btn-save-file" style="flex: 1; padding: 6px; cursor: pointer;">Save File</button>
          <button id="btn-load-file" style="flex: 1; padding: 6px; cursor: pointer;">Load File</button>
        </div>
      </aside>

      <main id="main-area">
        <div id="canvas-container">
          <div id="game-over-overlay" class="hidden">
            <div class="modal-content">
              <h1>GAME OVER</h1>
              <p>You have been slain in the dungeon!</p>
              <button onclick="window.location.reload()">Try Again</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
